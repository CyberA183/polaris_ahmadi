name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            runner: macos-latest
            app_name: polaris_desktop
            target: macOS
            asset_name: Polaris-macos-briefcase.zip
            artifact_name: Polaris-macos
          - label: Windows
            runner: windows-latest
            app_name: polaris_desktop
            target: windows
            asset_name: Polaris-windows-briefcase.zip
            artifact_name: Polaris-windows
          - label: Android
            runner: macos-latest
            app_name: polaris_mobile
            target: android
            asset_name: Polaris-android-briefcase.tar.gz
            artifact_name: Polaris-android
          - label: iOS
            runner: macos-latest
            app_name: polaris_mobile
            target: iOS
            asset_name: Polaris-ios-briefcase.tar.gz
            artifact_name: Polaris-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase

      - name: Set up Java for Android builds
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Build with Briefcase
        run: |
          briefcase create ${{ matrix.target }} -a ${{ matrix.app_name }} --no-input
          briefcase build ${{ matrix.target }} -a ${{ matrix.app_name }} --no-input
          briefcase package ${{ matrix.target }} -a ${{ matrix.app_name }} --no-input

      - name: Create archive (non-Windows)
        if: matrix.target == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist "${{ matrix.asset_name }}"

      - name: Create archive (mobile)
        if: matrix.target == 'android' || matrix.target == 'iOS'
        run: tar -czf "${{ matrix.asset_name }}" dist build

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\*", "build\*" -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Publish Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      # Strip the leading "v" from the tag to get a bare semver (e.g. v1.0.1 → 1.0.1)
      - name: Derive version string
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate version.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-assets/version.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Cross-platform Briefcase build artifacts.",
            "macos": {
              "url": "https://github.com/$REPO/releases/download/$TAG/Polaris-macos-briefcase.zip"
            },
            "windows": {
              "url": "https://github.com/$REPO/releases/download/$TAG/Polaris-windows-briefcase.zip"
            },
            "android": {
              "url": "https://github.com/$REPO/releases/download/$TAG/Polaris-android-briefcase.tar.gz"
            },
            "ios": {
              "url": "https://github.com/$REPO/releases/download/$TAG/Polaris-ios-briefcase.tar.gz"
            }
          }
          EOF

      - name: Normalize release assets
        run: |
          cp "release-assets/Polaris-macos/Polaris-macos-briefcase.zip" "release-assets/Polaris-macos-briefcase.zip"
          cp "release-assets/Polaris-windows/Polaris-windows-briefcase.zip" "release-assets/Polaris-windows-briefcase.zip"
          cp "release-assets/Polaris-android/Polaris-android-briefcase.tar.gz" "release-assets/Polaris-android-briefcase.tar.gz"
          cp "release-assets/Polaris-ios/Polaris-ios-briefcase.tar.gz" "release-assets/Polaris-ios-briefcase.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Polaris ${{ steps.version.outputs.version }}"
          body: |
            ## What's new in ${{ steps.version.outputs.version }}

            See commit history for details.

            ### Build Artifacts
            This release includes build archives generated by Briefcase for:
            - macOS
            - Windows
            - Android
            - iOS

            ### Auto-update
            The desktop app checks for updates automatically.
            Use **Help → Check for Updates** to check manually,
            then **Help → Download Latest Update** to stage the new version.
          files: |
            release-assets/Polaris-macos-briefcase.zip
            release-assets/Polaris-windows-briefcase.zip
            release-assets/Polaris-android-briefcase.tar.gz
            release-assets/Polaris-ios-briefcase.tar.gz
            release-assets/version.json
          draft: false
          prerelease: false
