name: Release Builds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            runner: macos-latest
            asset_name: Polaris.app.zip
            artifact_name: macos-build
          - label: Windows
            runner: windows-latest
            asset_name: Polaris-win.zip
            artifact_name: windows-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build packaged app
        run: python -m PyInstaller --clean --noconfirm polaris.spec

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Polaris.app" "${{ matrix.asset_name }}"

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Polaris" -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish Latest Release Assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Normalize artifact layout
        run: |
          cp "release-assets/macos-build/Polaris.app.zip" "release-assets/Polaris.app.zip"
          cp "release-assets/windows-build/Polaris-win.zip" "release-assets/Polaris-win.zip"

      - name: Resolve latest release tag
        id: latest_release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          tag_name="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ -z "${tag_name}" ]; then
            echo "No published GitHub release was found." >&2
            exit 1
          fi
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Generate version manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.latest_release.outputs.tag_name }}
        run: |
          python <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          version_path = Path("tools/updater/version.py")
          spec = importlib.util.spec_from_file_location("polaris_updater_version", version_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          asset_base = f"https://github.com/{__import__('os').environ['GITHUB_REPOSITORY']}/releases/download/{__import__('os').environ['RELEASE_TAG']}"
          manifest = {
              "version": module.APP_VERSION,
              "notes": "Automated cross-platform build",
              "macos": {
                  "url": f"{asset_base}/{module.DEFAULT_MACOS_ASSET_NAME}",
              },
              "windows": {
                  "url": f"{asset_base}/{module.DEFAULT_WINDOWS_ASSET_NAME}",
              },
          }

          output_path = Path("release-assets/version.json")
          output_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload assets to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.latest_release.outputs.tag_name }}" \
            "release-assets/Polaris.app.zip" \
            "release-assets/Polaris-win.zip" \
            "release-assets/version.json" \
            --clobber
