name: Release Builds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            runner: macos-latest
            app_name: polaris_desktop
            target: macOS
            asset_name: Polaris-macos-briefcase.zip
            artifact_name: macos-build
          - label: Windows
            runner: windows-latest
            app_name: polaris_desktop
            target: windows
            asset_name: Polaris-windows-briefcase.zip
            artifact_name: windows-build
          - label: Android
            runner: macos-latest
            app_name: polaris_mobile
            target: android
            asset_name: Polaris-android-briefcase.tar.gz
            artifact_name: android-build
          - label: iOS
            runner: macos-latest
            app_name: polaris_mobile
            target: iOS
            asset_name: Polaris-ios-briefcase.tar.gz
            artifact_name: ios-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m venv .briefcase-venv
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          payload = {
              "sessionId": "657330",
              "runId": "pre-fix",
              "hypothesisId": "H1-H5",
              "location": "release-builds.yml:install-build-tools-pre-activate",
              "message": "Collected runner shell and venv activation path state",
              "data": {
                  "runner_os": os.environ.get("RUNNER_OS"),
                  "matrix_target": "${{ matrix.target }}",
                  "matrix_label": "${{ matrix.label }}",
                  "github_workspace": os.environ.get("GITHUB_WORKSPACE"),
                  "shell_env": os.environ.get("SHELL"),
                  "comspec_env": os.environ.get("ComSpec"),
                  "pwsh_version_table_present": bool(os.environ.get("PSModulePath")),
                  "venv_bin_activate_exists": Path(".briefcase-venv/bin/activate").exists(),
                  "venv_scripts_activate_exists": Path(".briefcase-venv/Scripts/Activate.ps1").exists(),
                  "venv_scripts_python_exists": Path(".briefcase-venv/Scripts/python.exe").exists(),
                  "venv_bin_python_exists": Path(".briefcase-venv/bin/python").exists(),
              },
              "timestamp": int(time.time() * 1000),
          }
          # region agent log
          log_path = Path("/Users/arielthompson/Documents/IAMM_Research/polaris_ahmadi/.cursor/debug-657330.log")
          try:
              log_path.parent.mkdir(parents=True, exist_ok=True)
              with log_path.open("a", encoding="utf-8") as f:
                  f.write(json.dumps(payload) + "\n")
          except Exception as exc:
              payload["message"] = "Skipping local debug file write in hosted runner"
              payload["data"]["debug_file_error"] = str(exc)
          # endregion
          print(json.dumps(payload, indent=2))
          PY
          . .briefcase-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "briefcase==0.4.1" "rich<15"

      - name: Debug dependency scope
        run: |
          python - <<'PY'
          import json
          import time
          import tomllib
          from pathlib import Path
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_deps = pyproject.get("project", {}).get("dependencies", [])
          apps = pyproject.get("tool", {}).get("briefcase", {}).get("app", {})
          app_cfg = apps.get("${{ matrix.app_name }}", {})
          app_requires = app_cfg.get("requires", [])
          mac_cfg = app_cfg.get("macOS", {})
          payload = {
              "sessionId": "dd0640",
              "runId": "pre-fix",
              "hypothesisId": "H3",
              "location": "release-builds.yml:debug-dependency-scope",
              "message": "Collected Briefcase dependency and macOS target scope",
              "data": {
                  "target": "${{ matrix.target }}",
                  "app_name": "${{ matrix.app_name }}",
                  "project_dependencies_count": len(project_deps),
                  "project_dependencies_sample": project_deps[:5],
                  "app_requires_count": len(app_requires),
                  "app_requires_sample": app_requires[:5],
                  "contains_scipy_requirement": any("scipy" in req.lower() for req in app_requires),
                  "contains_pywebview_requirement": any("pywebview" in req.lower() for req in app_requires),
                  "macos_min_os_version": mac_cfg.get("min_os_version"),
                  "macos_universal_build": mac_cfg.get("universal_build"),
                  "contains_torch_requirement": any("torch" in req.lower() for req in app_requires),
              },
              "timestamp": int(time.time() * 1000),
          }
          # region agent log
          log_path = Path("/Users/arielthompson/Documents/IAMM_Research/polaris_ahmadi/.cursor/debug-dd0640.log")
          try:
              log_path.parent.mkdir(parents=True, exist_ok=True)
              with log_path.open("a", encoding="utf-8") as f:
                  f.write(json.dumps(payload) + "\n")
          except Exception as exc:
              payload["hypothesisId"] = "H2"
              payload["message"] = "Skipping local debug file write in hosted runner"
              payload["data"]["debug_file_error"] = str(exc)
          # endregion
          print(json.dumps(payload, indent=2))
          PY

      - name: Set up Java for Android builds
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Build packaged app with Briefcase
        run: |
          . .briefcase-venv/bin/activate
          briefcase create ${{ matrix.target }} -a ${{ matrix.app_name }} --no-input -v

      - name: Verify macOS app contents after create
        if: matrix.target == 'macOS'
        run: |
          . .briefcase-venv/bin/activate
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          app_root = Path("build/polaris_desktop/macos/app")
          app_candidates = list(app_root.glob("*.app"))
          resources_dir = None
          if app_candidates:
              resources_dir = app_candidates[0] / "Contents" / "Resources"
          app_packages_dir = resources_dir / "app_packages" if resources_dir else None

          payload = {
              "sessionId": "dd0640",
              "runId": "post-fix",
              "hypothesisId": "H5",
              "location": "release-builds.yml:verify-macos-content",
              "message": "Verified macOS app contents after Briefcase cleanup step",
              "data": {
                  "app_bundle_found": bool(app_candidates),
                  "app_bundle_path": str(app_candidates[0]) if app_candidates else None,
                  "resources_dir_exists": bool(resources_dir and resources_dir.exists()),
                  "app_packages_exists": bool(app_packages_dir and app_packages_dir.exists()),
                  "app_packages_file_count": (
                      sum(1 for _ in app_packages_dir.rglob("*")) if app_packages_dir and app_packages_dir.exists() else 0
                  ),
                  "streamlit_present": bool(
                      app_packages_dir and (app_packages_dir / "streamlit").exists()
                  ),
                  "pandas_present": bool(
                      app_packages_dir and (app_packages_dir / "pandas").exists()
                  ),
              },
              "timestamp": int(time.time() * 1000),
          }
          # region agent log
          log_path = Path("/Users/arielthompson/Documents/IAMM_Research/polaris_ahmadi/.cursor/debug-dd0640.log")
          try:
              log_path.parent.mkdir(parents=True, exist_ok=True)
              with log_path.open("a", encoding="utf-8") as f:
                  f.write(json.dumps(payload) + "\n")
          except Exception as exc:
              payload["message"] = "Skipping local debug file write in hosted runner"
              payload["data"]["debug_file_error"] = str(exc)
          # endregion
          print(json.dumps(payload, indent=2))
          PY

      - name: Continue Briefcase build/package
        run: |
          . .briefcase-venv/bin/activate
          briefcase build ${{ matrix.target }} -a ${{ matrix.app_name }} --no-input
          briefcase package ${{ matrix.target }} -a ${{ matrix.app_name }} --no-input

      - name: Archive macOS artifact
        if: matrix.target == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist "${{ matrix.asset_name }}"

      - name: Archive mobile artifact
        if: matrix.target == 'android' || matrix.target == 'iOS'
        run: tar -czf "${{ matrix.asset_name }}" dist build

      - name: Archive Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\*", "build\*" -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

      - name: Upload Briefcase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefcase-logs-${{ matrix.label }}
          path: logs/briefcase*.log
          if-no-files-found: ignore

  publish:
    name: Aggregate Build Artifacts
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Normalize artifact layout
        run: |
          cp "release-assets/macos-build/Polaris-macos-briefcase.zip" "release-assets/Polaris-macos-briefcase.zip"
          cp "release-assets/windows-build/Polaris-windows-briefcase.zip" "release-assets/Polaris-windows-briefcase.zip"
          cp "release-assets/android-build/Polaris-android-briefcase.tar.gz" "release-assets/Polaris-android-briefcase.tar.gz"
          cp "release-assets/ios-build/Polaris-ios-briefcase.tar.gz" "release-assets/Polaris-ios-briefcase.tar.gz"

      - name: Upload merged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: briefcase-cross-platform-builds
          path: |
            release-assets/Polaris-macos-briefcase.zip
            release-assets/Polaris-windows-briefcase.zip
            release-assets/Polaris-android-briefcase.tar.gz
            release-assets/Polaris-ios-briefcase.tar.gz
